version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: erp_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_cache
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_cache"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: erp_redis
    # maxmemory must be set here so the noeviction policy has an actual
    # trigger point. Without maxmemory, noeviction has no effect.
    # 50mb is generous for 30 unique keys with small string values.
    command: >
      redis-server
      --maxmemory 50mb
      --maxmemory-policy noeviction
      --save ""
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
